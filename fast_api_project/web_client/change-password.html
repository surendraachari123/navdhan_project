<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change password — NavDhan Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-brand">
    <div class="auth-brand-mark">NavDhan Mutual Fund Services</div>
    <div>
      <h1 id="brandHeadline">Set a permanent password.</h1>
      <p id="brandSub">Your account was created with a temporary password. Choose a new one to continue.</p>
    </div>
    <div class="auth-brand-footer">Minimum 8 characters</div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <div class="eyebrow">Account security</div>
      <h2>Change your password</h2>
      <p class="sub" id="formSub">Enter your current password and choose a new one.</p>

      <div id="alert" class="alert"></div>

      <form id="changeForm">
        <div class="field">
          <label for="current_password">Current password</label>
          <input id="current_password" name="current_password" type="password" required>
          <div class="hint" id="currentHint"></div>
        </div>
        <div class="field">
          <label for="new_password">New password</label>
          <input id="new_password" name="new_password" type="password" minlength="8" required>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm new password</label>
          <input id="confirm_password" name="confirm_password" type="password" minlength="8" required>
        </div>
        <button class="btn btn-gold btn-block" type="submit" id="submitBtn">Update password</button>
      </form>

      <div class="auth-links" id="skipLinkWrap" style="display:none;">
        <a href="dashboard.html">Back to console</a>
        <span></span>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  if (!Session.isLoggedIn()) window.location.href = "login.html";

  const forced = Session.mustChangePassword();
  if (!forced) {
    document.getElementById("brandHeadline").textContent = "Update your password.";
    document.getElementById("brandSub").textContent = "Choose a new password for your account.";
    document.getElementById("formSub").textContent = "Enter your current password and choose a new one.";
    document.getElementById("skipLinkWrap").style.display = "flex";
  } else {
    document.getElementById("currentHint").textContent = "This is the temporary password you were emailed.";
  }

  const form = document.getElementById("changeForm");
  const alertEl = document.getElementById("alert");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlert(alertEl);

    const currentPassword = document.getElementById("current_password").value;
    const newPassword = document.getElementById("new_password").value;
    const confirmPassword = document.getElementById("confirm_password").value;

    if (newPassword !== confirmPassword) {
      showAlert(alertEl, "New passwords do not match.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Updating…";

    try {
      const result = await apiFetch("/change-password", {
        method: "POST",
        body: { current_password: currentPassword, new_password: newPassword },
      });
      const session = Session.get();
      session.force_password_change = false;
      Session.set(session);
      showAlert(alertEl, result.message + " Redirecting…", "success");
      setTimeout(() => (window.location.href = "dashboard.html"), 1200);
    } catch (err) {
      showAlert(alertEl, err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = "Update password";
    }
  });
</script>
</body>
</html>
