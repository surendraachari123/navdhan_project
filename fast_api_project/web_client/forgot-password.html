<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — NavDhan Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-brand">
    <div class="auth-brand-mark">NavDhan Mutual Fund Services</div>
    <div>
      <h1>We'll send a reset link.</h1>
      <p>If that email matches an account, a one-time link arrives shortly and expires after 30 minutes.</p>
    </div>
    <div class="auth-brand-footer">One link, one use, time-limited</div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <div class="eyebrow">Password reset</div>
      <h2>Forgot your password?</h2>
      <p class="sub">Enter the email on your account.</p>

      <div id="alert" class="alert"></div>

      <form id="forgotForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
        </div>
        <button class="btn btn-gold btn-block" type="submit" id="submitBtn">Send reset link</button>
      </form>

      <div class="auth-links">
        <a href="login.html">Back to sign in</a>
        <a href="reset-password.html">I already have a token</a>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  const form = document.getElementById("forgotForm");
  const alertEl = document.getElementById("alert");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlert(alertEl);
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    const email = document.getElementById("email").value.trim();

    try {
      const result = await apiFetch("/forgot-password", { method: "POST", body: { email }, auth: false });
      showAlert(alertEl, result.message, "success");
    } catch (err) {
      showAlert(alertEl, err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Send reset link";
    }
  });
</script>
</body>
</html>
