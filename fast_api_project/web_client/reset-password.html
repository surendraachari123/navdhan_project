<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — NavDhan Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-brand">
    <div class="auth-brand-mark">NavDhan Mutual Fund Services</div>
    <div>
      <h1>Set a new password.</h1>
      <p>Paste the token from your reset email, or follow the link directly and this field fills itself in.</p>
    </div>
    <div class="auth-brand-footer">Minimum 8 characters</div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <div class="eyebrow">Password reset</div>
      <h2>Choose a new password</h2>
      <p class="sub">This link can only be used once.</p>

      <div id="alert" class="alert"></div>

      <form id="resetForm">
        <div class="field">
          <label for="token">Reset token</label>
          <input id="token" name="token" type="text" class="mono" required>
        </div>
        <div class="field">
          <label for="new_password">New password</label>
          <input id="new_password" name="new_password" type="password" minlength="8" required>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm new password</label>
          <input id="confirm_password" name="confirm_password" type="password" minlength="8" required>
        </div>
        <button class="btn btn-gold btn-block" type="submit" id="submitBtn">Reset password</button>
      </form>

      <div class="auth-links">
        <a href="login.html">Back to sign in</a>
        <span></span>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  // Pre-fill from ?token=... if the user followed the emailed link.
  const params = new URLSearchParams(window.location.search);
  if (params.get("token")) {
    document.getElementById("token").value = params.get("token");
  }

  const form = document.getElementById("resetForm");
  const alertEl = document.getElementById("alert");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlert(alertEl);

    const token = document.getElementById("token").value.trim();
    const newPassword = document.getElementById("new_password").value;
    const confirmPassword = document.getElementById("confirm_password").value;

    if (newPassword !== confirmPassword) {
      showAlert(alertEl, "Passwords do not match.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Resetting…";

    try {
      const result = await apiFetch("/reset-password", {
        method: "POST",
        body: { token, new_password: newPassword },
        auth: false,
      });
      showAlert(alertEl, result.message + " Redirecting to sign in…", "success");
      setTimeout(() => (window.location.href = "login.html"), 1800);
    } catch (err) {
      showAlert(alertEl, err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = "Reset password";
    }
  });
</script>
</body>
</html>
