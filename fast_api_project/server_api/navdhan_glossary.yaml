metadata:
  name: NavDhan FastAPI Business Glossary
  version: "1.0"
  database: Oracle
  purpose: >
    Semantic glossary for Qdrant retrieval and LLM-to-SQL generation over the
    NavDhan FastAPI data (investors and mutual fund transactions).
  important_note: >
    Oracle remains the source of truth. Qdrant stores semantic metadata only,
    never row data. Re-run ingestion (python ingest_glossary.py, or POST /ai/reindex
    as admin) after editing this file.

global_rules:
  - Generate Oracle SQL only. One read-only SELECT (or WITH ... SELECT) statement, no semicolon, no comments.
  - Query only the tables documented in this glossary. Do not use any schema prefix.
  - Never invent tables, columns, metrics or relationships.
  - Do not double-quote identifiers.
  - Use FETCH FIRST n ROWS ONLY for top-N questions (never LIMIT, never TOP).
  - Prefer aggregates and GROUP BY over listing raw rows; add ORDER BY; keep results small.
  - For ranking questions such as "top 5", order the requested measure DESC.
  - Compare text values case-safely, for example UPPER(txn_type) = 'SIP'.
  - Match the business entity (investor, transaction, scheme, folio) before choosing the metric.
  - Use a join only when the question needs columns from both tables.
  - Give every computed column a readable alias such as total_amount.

views:

  investor_table:
    schema: current user
    object_type: table
    business_name: Investor
    category: dimension
    business_terms:
      - investor
      - customer
      - client
      - unit holder
      - account holder
    description: One row per investor. Master data with contact details and KYC status.
    business_purpose: Count investors, filter or group by KYC status, and attach names to transaction results.
    grain: One row per investor_id.
    columns:
      - name: investor_id
        data_type: VARCHAR2
        business_definition: Unique identifier of the investor. Primary key. Joins to mfund_transactions.investor_id.
      - name: name
        data_type: VARCHAR2
        business_definition: Full name of the investor.
      - name: kyc_status
        data_type: VARCHAR2
        business_definition: "KYC (know your customer) compliance status. Exactly one of 'Verified', 'Pending', 'Rejected' (capitalised)."
      - name: email
        data_type: VARCHAR2
        sensitive: true
        business_definition: Investor email address. Personal data - admins only.
      - name: mobile
        data_type: VARCHAR2
        sensitive: true
        business_definition: Investor mobile number. Personal data - admins only.
      - name: pan
        data_type: VARCHAR2
        sensitive: true
        business_definition: Investor PAN (permanent account number). Personal data - admins only.
    keywords:
      - investors
      - kyc
      - verified
      - pending
      - rejected
      - how many investors

  mfund_transactions:
    schema: current user
    object_type: table
    business_name: Mutual fund transaction
    category: fact
    business_terms:
      - transaction
      - purchase
      - SIP
      - systematic investment plan
      - redemption
      - withdrawal
      - investment
      - folio
      - scheme
      - NAV
      - units
    description: One row per mutual fund transaction (purchase, SIP instalment or redemption).
    business_purpose: Measure investment inflows and outflows, trends over time, and activity by scheme, folio or investor.
    grain: One row per transaction_id.
    columns:
      - name: transaction_id
        data_type: NUMBER
        business_definition: Unique identifier of the transaction, generated by the database.
      - name: folio_id
        data_type: VARCHAR2
        business_definition: Folio (investment account) the transaction was made in.
      - name: investor_id
        data_type: VARCHAR2
        business_definition: Investor who made the transaction. Foreign key to investor_table.investor_id.
      - name: scheme_id
        data_type: VARCHAR2
        business_definition: Identifier of the mutual fund scheme bought or sold. There is no scheme master table; report the id.
      - name: units
        data_type: NUMBER
        business_definition: Number of fund units bought or sold. Always positive.
      - name: nav
        data_type: NUMBER
        business_definition: Net asset value per unit on the transaction date.
      - name: amount
        data_type: NUMBER
        business_definition: Transaction value in Indian rupees (units multiplied by NAV). Always positive; direction comes from txn_type.
      - name: txn_type
        data_type: VARCHAR2
        business_definition: "Kind of transaction. Exactly one of 'PURCHASE', 'SIP', 'REDEMPTION' (upper-case)."
      - name: txn_date
        data_type: DATE
        business_definition: Date of the transaction. Use it for all time-based analysis.
    keywords:
      - amount
      - invested
      - sip
      - redemption
      - purchase
      - scheme
      - folio
      - monthly
      - trend

business_metrics:

  total_inflow:
    definition: Money invested. Sum of amount for PURCHASE and SIP transactions.
    sql_expression: "SUM(CASE WHEN txn_type IN ('PURCHASE','SIP') THEN amount ELSE 0 END)"
    source: mfund_transactions
    synonyms: [total investment, gross investment, money invested, inflow, sales]

  total_outflow:
    definition: Money withdrawn. Sum of amount for REDEMPTION transactions.
    sql_expression: "SUM(CASE WHEN txn_type = 'REDEMPTION' THEN amount ELSE 0 END)"
    source: mfund_transactions
    synonyms: [withdrawals, redemptions amount, outflow]

  net_investment:
    definition: Inflow minus outflow. Purchases and SIPs add, redemptions subtract.
    sql_expression: "SUM(CASE WHEN txn_type IN ('PURCHASE','SIP') THEN amount ELSE -amount END)"
    source: mfund_transactions
    synonyms: [net inflow, net flow, net amount, net sales, current investment, invested balance]
    note: >
      The data has no live NAV or holdings table, so AUM and portfolio value are not available.
      Net investment is the closest measure; say so when the user asks for AUM or holdings.

  sip_amount:
    definition: Total amount invested through systematic investment plans.
    sql_expression: "SUM(CASE WHEN txn_type = 'SIP' THEN amount ELSE 0 END)"
    source: mfund_transactions
    synonyms: [SIP value, SIP book, SIP collections]

  transaction_count:
    definition: Number of transactions.
    sql_expression: "COUNT(*)"
    source: mfund_transactions

  active_investors:
    definition: Distinct investors who have at least one transaction.
    sql_expression: "COUNT(DISTINCT investor_id)"
    source: mfund_transactions
    synonyms: [transacting investors, investors with transactions]

  average_ticket_size:
    definition: Average transaction amount.
    sql_expression: "AVG(amount)"
    source: mfund_transactions
    synonyms: [average transaction value, average investment]

  kyc_compliance_rate:
    definition: Share of investors whose kyc_status is Verified.
    sql_expression: "ROUND(100 * SUM(CASE WHEN kyc_status = 'Verified' THEN 1 ELSE 0 END) / COUNT(*), 2)"
    source: investor_table

relationships:

  - name: transaction_to_investor
    description: Every transaction belongs to one investor.
    from: mfund_transactions.investor_id
    to: investor_table.investor_id
    join: "mfund_transactions t JOIN investor_table i ON i.investor_id = t.investor_id"
    use_when: The question needs investor attributes (name, KYC status) together with transaction measures.

  - name: investors_without_transactions
    description: Investors with no transactions are found with NOT EXISTS (or a LEFT JOIN) from investor_table to mfund_transactions.
    join: "investor_table i LEFT JOIN mfund_transactions t ON t.investor_id = i.investor_id"
    use_when: Questions about dormant, inactive or new investors who have not yet invested.

business_rules:

  inflow_vs_outflow:
    rule: PURCHASE and SIP are inflows. REDEMPTION is an outflow. amount is always positive, so never SUM(amount) alone when net investment is wanted.

  txn_type_values:
    rule: "txn_type is stored upper-case: 'PURCHASE', 'SIP', 'REDEMPTION'. Use these exact literals."

  kyc_status_values:
    rule: "kyc_status is stored capitalised: 'Verified', 'Pending', 'Rejected'. Compare with UPPER() when unsure."

  dates:
    rule: >
      Use txn_date for time analysis. Group months with TO_CHAR(txn_date,'YYYY-MM') or TRUNC(txn_date,'MM').
      For "last N months" use txn_date >= ADD_MONTHS(TRUNC(SYSDATE,'MM'), -N). For a specific year use
      txn_date >= DATE '2025-01-01' AND txn_date < DATE '2026-01-01'.

  currency:
    rule: Amounts are Indian rupees.

  personal_data:
    rule: Investor contact and identity columns are personal data and are restricted to admin users.

  scope_limits:
    rule: >
      There is no scheme name, AMC, branch, agent or NAV history in this database. If asked for something
      that is not stored, answer in plain language and say which questions can be answered instead.

question_patterns:

  - name: top_n_ranking
    example_questions:
      - Top 5 investors by investment
      - Which scheme has the highest SIP amount
    guidance: Aggregate the metric, ORDER BY it DESC, and use FETCH FIRST n ROWS ONLY.

  - name: monthly_trend
    example_questions:
      - Monthly SIP amount for the last 6 months
      - Show investment trend month by month
    guidance: Group by TO_CHAR(txn_date,'YYYY-MM'), order by that month ascending.

  - name: distribution
    example_questions:
      - How many investors have each KYC status
      - Transactions by type
    guidance: GROUP BY the category column and COUNT(*) or SUM(amount).

  - name: compliance_risk
    example_questions:
      - Investors who transacted without verified KYC
      - Amount invested by investors with pending KYC
    guidance: Join transactions to investors and filter kyc_status <> 'Verified'.

  - name: dormant_investors
    example_questions:
      - Which investors have never invested
      - How many investors have no transactions
    guidance: Use NOT EXISTS against mfund_transactions.

semantic_context:

  business_language:

    sip:
      meaning: Systematic investment plan - a recurring investment. Stored as txn_type = 'SIP'.
    redemption:
      meaning: Withdrawal of money from a scheme. Stored as txn_type = 'REDEMPTION'.
    purchase:
      meaning: One-time investment (lump sum). Stored as txn_type = 'PURCHASE'.
    kyc:
      meaning: Know-your-customer verification. Stored in investor_table.kyc_status.
    investment:
      meaning: When unqualified, "investment" means total inflow (PURCHASE plus SIP). "Net investment" means inflow minus redemptions.
    customer_or_client:
      meaning: Customer, client and investor all refer to a row in investor_table.
    aum:
      meaning: Assets under management is not stored. Use net investment as an approximation and say that it is not market value.

  question_interpretation:

    how_much_invested:
      interpretation: Use total_inflow unless the user says net, then use net_investment.
    best_or_highest:
      interpretation: Order the requested measure DESC and return the top rows.
    this_year_or_last_month:
      interpretation: Use txn_date with SYSDATE based ranges, see the dates rule.

  sql_generation_examples:

    investors_by_kyc_status:
      question: How many investors have each KYC status?
      sql: |
        SELECT kyc_status, COUNT(*) AS investors
        FROM investor_table
        GROUP BY kyc_status
        ORDER BY investors DESC

    total_investors:
      question: How many investors are there?
      sql: |
        SELECT COUNT(*) AS total_investors
        FROM investor_table

    transactions_by_type:
      question: Show the number of transactions and total amount by transaction type
      sql: |
        SELECT txn_type, COUNT(*) AS transactions, SUM(amount) AS total_amount
        FROM mfund_transactions
        GROUP BY txn_type
        ORDER BY total_amount DESC

    total_sip_by_scheme:
      question: What is the total SIP amount by scheme?
      sql: |
        SELECT scheme_id, SUM(amount) AS total_sip_amount
        FROM mfund_transactions
        WHERE txn_type = 'SIP'
        GROUP BY scheme_id
        ORDER BY total_sip_amount DESC

    top_investors_by_net_investment:
      question: Top 10 investors by net investment
      sql: |
        SELECT i.investor_id, i.name,
               SUM(CASE WHEN t.txn_type IN ('PURCHASE','SIP') THEN t.amount ELSE -t.amount END) AS net_investment
        FROM mfund_transactions t
        JOIN investor_table i ON i.investor_id = t.investor_id
        GROUP BY i.investor_id, i.name
        ORDER BY net_investment DESC
        FETCH FIRST 10 ROWS ONLY

    monthly_sip_last_6_months:
      question: Monthly SIP amount for the last 6 months
      sql: |
        SELECT TO_CHAR(txn_date,'YYYY-MM') AS month, SUM(amount) AS sip_amount
        FROM mfund_transactions
        WHERE txn_type = 'SIP'
          AND txn_date >= ADD_MONTHS(TRUNC(SYSDATE,'MM'), -6)
        GROUP BY TO_CHAR(txn_date,'YYYY-MM')
        ORDER BY month

    monthly_inflow_outflow:
      question: Show monthly inflow versus outflow
      sql: |
        SELECT TO_CHAR(txn_date,'YYYY-MM') AS month,
               SUM(CASE WHEN txn_type IN ('PURCHASE','SIP') THEN amount ELSE 0 END) AS inflow,
               SUM(CASE WHEN txn_type = 'REDEMPTION' THEN amount ELSE 0 END) AS outflow
        FROM mfund_transactions
        GROUP BY TO_CHAR(txn_date,'YYYY-MM')
        ORDER BY month

    investors_without_verified_kyc_who_transacted:
      question: Which investors transacted without verified KYC?
      sql: |
        SELECT i.investor_id, i.name, i.kyc_status, SUM(t.amount) AS total_amount
        FROM mfund_transactions t
        JOIN investor_table i ON i.investor_id = t.investor_id
        WHERE i.kyc_status <> 'Verified'
        GROUP BY i.investor_id, i.name, i.kyc_status
        ORDER BY total_amount DESC
        FETCH FIRST 20 ROWS ONLY

    investors_never_invested:
      question: Which investors have never made a transaction?
      sql: |
        SELECT i.investor_id, i.name
        FROM investor_table i
        WHERE NOT EXISTS (SELECT 1 FROM mfund_transactions t WHERE t.investor_id = i.investor_id)
        ORDER BY i.investor_id
        FETCH FIRST 50 ROWS ONLY

    redemptions_by_scheme:
      question: Which scheme has the highest redemptions?
      sql: |
        SELECT scheme_id, SUM(amount) AS redeemed_amount, COUNT(*) AS redemptions
        FROM mfund_transactions
        WHERE txn_type = 'REDEMPTION'
        GROUP BY scheme_id
        ORDER BY redeemed_amount DESC
        FETCH FIRST 10 ROWS ONLY

    investment_for_one_investor:
      question: What is the total investment of investor INV001?
      sql: |
        SELECT investor_id,
               SUM(CASE WHEN txn_type IN ('PURCHASE','SIP') THEN amount ELSE 0 END) AS total_invested,
               SUM(CASE WHEN txn_type = 'REDEMPTION' THEN amount ELSE 0 END) AS total_redeemed
        FROM mfund_transactions
        WHERE investor_id = 'INV001'
        GROUP BY investor_id

    average_ticket_size_by_type:
      question: What is the average transaction amount for each transaction type?
      sql: |
        SELECT txn_type, ROUND(AVG(amount), 2) AS average_amount
        FROM mfund_transactions
        GROUP BY txn_type
